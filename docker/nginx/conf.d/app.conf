# ==============================================================================
# Proxy reverso do Guardião Fiscal.
# Substitua "guardiaofiscal.com.br" pelo domínio real (o install-vps.sh faz isso).
# Subdomínios de tenant (escritorio1.dominio) caem no mesmo server (wildcard);
# a aplicação resolve o tenant pelo Host.
# ==============================================================================

# HTTP: desafio ACME + redirect para HTTPS
server {
    listen 80;
    server_name guardiaofiscal.com.br *.guardiaofiscal.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name guardiaofiscal.com.br *.guardiaofiscal.com.br;

    ssl_certificate     /etc/letsencrypt/live/guardiaofiscal.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/guardiaofiscal.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # API
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Rotas de autenticação: rate limit mais agressivo (força bruta)
    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://api:3001/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Next.js
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
