# ==============================================================================
# GUARDIÃO FISCAL — instalação em VPS COMPARTILHADA (demonstração/testes)
# Convive com outros sistemas: rede Docker isolada, volumes próprios e UMA única
# porta publicada (web em ${SHARED_WEB_PORT:-8100}). Banco, Redis, MinIO e API
# ficam acessíveis apenas dentro da rede interna da stack.
# Uso:  docker compose -f docker-compose.shared.yml --env-file .env.shared up -d --build
# Demo por HTTP: exige COOKIE_SECURE=false no .env.shared (sem TLS na porta alta).
# ==============================================================================
name: guardiao-shared

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guardiao}
      POSTGRES_USER: ${POSTGRES_USER:-guardiao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env.shared}
    volumes:
      - gf_shared_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guardiao} -d ${POSTGRES_DB:-guardiao}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks: [gf-internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - gf_shared_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *default-logging
    networks: [gf-internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - gf_shared_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks: [gf-internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardiao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardiao}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:?}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_DOCUMENTS: documentos
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks: [gf-internal]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-guardiao}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardiao}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    networks: [gf-internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:3001
        NEXT_PUBLIC_BRAND_NAME: ${NEXT_PUBLIC_BRAND_NAME:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:3001
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      - api
    ports:
      - "${SHARED_WEB_PORT:-8100}:3000" # ÚNICA porta exposta da stack
    logging: *default-logging
    networks: [gf-internal]

volumes:
  gf_shared_pg:
  gf_shared_redis:
  gf_shared_minio:

networks:
  gf-internal:
    driver: bridge
