name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://guardiao:ci_password@localhost:5432/guardiao?schema=public
  JWT_ACCESS_SECRET: ci-somente-teste-access-secret-com-32-chars!!
  JWT_REFRESH_SECRET: ci-somente-teste-refresh-secret-com-32-chars!
  ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  SEED_SUPERADMIN_EMAIL: ci@guardiaofiscal.test
  SEED_SUPERADMIN_PASSWORD: SenhaDeCI!12345
  REDIS_HOST: localhost
  REDIS_PORT: '6379'
  MINIO_ENDPOINT: localhost
  MINIO_PORT: '9000'
  MINIO_USE_SSL: 'false'
  MINIO_ROOT_USER: guardiao
  MINIO_ROOT_PASSWORD: ci_minio_password
  MINIO_BUCKET_DOCUMENTS: documentos

jobs:
  test:
    name: Build + testes (unit e e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: guardiao
          POSTGRES_USER: guardiao
          POSTGRES_PASSWORD: ci_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guardiao"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # services não suportam args de comando; o MinIO oficial exige "server /data"
      - name: Subir MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=guardiao -e MINIO_ROOT_PASSWORD=ci_minio_password \
            minio/minio:latest server /data
          for i in $(seq 1 20); do
            curl -fsS http://localhost:9000/minio/health/live && break || sleep 2
          done

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Prisma generate (tipos usados pelo build do worker e da api)
        working-directory: apps/api
        run: npx prisma generate

      - name: Build (shared -> worker/api/web)
        run: pnpm -r build

      - name: Migrations + seed
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npx ts-node prisma/seed.ts

      - name: Testes unitários
        working-directory: apps/api
        run: pnpm test

      - name: Testes e2e (isolamento de tenants é bloqueante)
        working-directory: apps/api
        run: pnpm test:e2e

  docker:
    name: Build das imagens de produção
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API
        run: docker build -f apps/api/Dockerfile -t gf-api:ci .
      - name: Worker
        run: docker build -f apps/worker/Dockerfile -t gf-worker:ci .
      - name: Web
        run: docker build -f apps/web/Dockerfile --build-arg NEXT_PUBLIC_API_URL=https://example.invalid/api -t gf-web:ci .
